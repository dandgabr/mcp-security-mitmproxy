[build-system]
requires = ["hatchling>=1.32"]
build-backend = "hatchling.build"

[project]
name = "mcp-security-mitmproxy"
version = "0.1.0"
description = "MCP server exposing the mitmproxy ecosystem (mitmdump, mitmweb, mitmproxy) to AI agents."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.13"
keywords = ["mcp", "mitmproxy", "security", "proxy", "ai-agents"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Security",
    "Topic :: Internet :: Proxy Servers",
]
dependencies = [
    "mitmproxy>=12.2,<13",
    "fastmcp>=4.0.5,<5",
    "mcp>=2.2.0,<3",
    "pydantic>=2.13,<3",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=9",
    "pytest-asyncio>=1",
    "pytest-cov>=7",
    "ruff>=0.16",
]

[project.scripts]
mcp-security-mitmproxy = "mcp_security_mitmproxy.__main__:main"

# Security overrides: mitmproxy 12.2.3 pins transitive upper bounds that block
# patched releases of tornado/h2/cryptography/msgpack (Dependabot alerts 1-10).
# mitmproxy's own `main` already relaxed these exact bounds to pick up the
# fixes; we mirror the versions it tests there until a release ships them.
[tool.uv]
override-dependencies = [
    "tornado>=6.5.8,<=6.5.8",
    "h2>=4.4.1,<=4.4.1",
    "cryptography>=50.0.0,<=50.0.0",
    "msgpack>=1.2.1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_security_mitmproxy"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "docs", "README.md", "LICENSE"]

[tool.pytest.ini_options]
minversion = "9.0"
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra --strict-markers"
markers = [
    "integration: end-to-end tests that spawn real mitmproxy subprocesses and sockets",
]

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["src", "tests"]
extend-exclude = ["docs"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["mcp_security_mitmproxy", "tests"]

[tool.ruff.format]
quote-style = "double"
